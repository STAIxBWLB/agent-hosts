name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
  id-token: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "$GITHUB_REF_NAME ($GITHUB_SHA) is not on origin/main; merge to main and tag the merged commit"; exit 1; }
      - name: Verify tag matches the package version
        run: |
          node <<'NODE'
          const { version } = require("./package.json");
          const tag = process.env.GITHUB_REF_NAME;
          if (tag !== `v${version}`) {
            throw new Error(`tag ${tag} does not match package.json version ${version}`);
          }
          NODE
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - name: Test with a scratch home
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          HOME="$test_home" bun test
      - run: bun scripts/check-pack.ts
      - run: npm install -g npm@11.20.0
      - run: npm publish --access public
